name: SEO automático

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seo:
    # No se vuelve a ejecutar con el commit que hace este propio flujo
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar fechas del sitemap
        run: python3 .github/scripts/seo.py sitemap

      - name: Guardar sitemap si ha cambiado
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar fechas del sitemap" sitemap.xml
            git push
          fi

      - name: Esperar a que GitHub Pages publique
        run: sleep 90

      - name: Avisar a IndexNow (Bing) de las páginas cambiadas
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 .github/scripts/seo.py indexnow
